<svg width="380" height="120" viewBox="0 0 380 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AIR Lab monochrome">
  <title>AIR Lab Logo (Monochrome)</title>
  <defs>
    <style>
      .wm { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .sub { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <g transform="translate(16, 18)" fill="#0B3B47">
