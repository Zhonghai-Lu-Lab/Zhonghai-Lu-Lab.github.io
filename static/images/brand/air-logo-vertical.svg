<svg width="180" height="220" viewBox="0 0 180 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AIR Lab vertical logo">
  <title>AIR Lab Vertical Logo</title>
  <defs>
    <style>
      .wm { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .sub { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Mark centered at top -->
  <g transform="translate(38, 18)">
    <polygon points="0,72 32,72 84,20 52,20" fill="#8BB7C4"/>
    <polygon points="32,84 60,84 92,52 64,52" fill="#F0B841"/>
    <circle cx="74" cy="74" r="3.5" fill="#FFFFFF"/>
    <polygon points="60,96 88,96 100,84 72,84" fill="#8BB7C4"/>
    <rect x="86" y="80" width="14" height="12" rx="2" fill="#8BB7C4"/>
  </g>

  <!-- Wordmark below mark, centered -->
  <text x="90" y="160" class="wm" font-size="44" fill="#0B3B47" letter-spacing="2.5" text-anchor="middle">AIR</text>
  <text x="90" y="185" class="sub" font-size="9" fill="#5A7378" letter-spacing="2.5" text-anchor="middle">ARCHITECTURE · INTELLIGENCE</text>
  <text x="90" y="200" class="sub" font-size="9" fill="#5A7378" letter-spacing="2.5" text-anchor="middle">RELIABILITY</text>
</svg>