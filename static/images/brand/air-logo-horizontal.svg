<svg width="380" height="120" viewBox="0 0 380 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AIR Lab — Architecture, Intelligence, Reliability">
  <title>AIR Lab Logo</title>
  <defs>
    <style>
      .wm { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .sub { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Mark: three stepped diagonal stripes representing A, I, R -->
  <g transform="translate(16, 18)">
    <!-- A (Architecture): triangular wedge - foundation -->
    <polygon points="0,72 32,72 84,20 52,20" fill="#8BB7C4"/>
    <!-- I (Intelligence): yellow stripe with signal node -->
    <polygon points="32,84 60,84 92,52 64,52" fill="#F0B841"/>
    <circle cx="74" cy="74" r="3.5" fill="#FFFFFF"/>
    <!-- R (Reliability): rounded rectangle (shield) -->
    <polygon points="60,96 88,96 100,84 72,84" fill="#8BB7C4"/>
    <rect x="86" y="80" width="14" height="12" rx="2" fill="#8BB7C4"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(140, 0)">
    <text x="0" y="64" class="wm" font-size="54" fill="#0B3B47" letter-spacing="2.5">AIR</text>
    <text x="0" y="90" class="sub" font-size="10.5" fill="#5A7378" letter-spacing="2.8" font-weight="500">ARCHITECTURE · INTELLIGENCE · RELIABILITY</text>
  </g>
</svg>