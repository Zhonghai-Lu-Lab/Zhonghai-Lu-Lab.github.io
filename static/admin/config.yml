backend:
  name: github
  repo: Zhonghai-Lu-Lab/zhonghai-lu-lab-website
  branch: main
  base_url: https://zhonghai-lu-lab-website.pages.dev
  auth_endpoint: /auth
  site_domain: zhonghai-lu-lab-website.pages.dev

publish_mode: editorial_workflow
media_folder: static/images/uploads
public_folder: /images/uploads

i18n:
  structure: multiple_folders
  locales: [en, zh]
  default_locale: en

collections:
  - name: news
    label: News / 新闻
    label_singular: News entry / 新闻
    description: "Edit the English and Chinese versions in the same entry. Save creates a draft only; click Publish and wait for GitHub and Cloudflare deployment. / 在同一条目中切换 English 与中文；保存只是草稿，必须点击 Publish。"
    folder: content/cms/news
    create: true
    i18n: true
    filter: {field: cms_managed, value: true}
    path: '{{slug}}/index'
    fields:
      - {label: CMS managed, name: cms_managed, widget: hidden, default: true, i18n: duplicate}
      - {label: Title / 标题, name: title, widget: string, i18n: true}
      - {label: Publication date / 发布日期, name: date, widget: datetime, time_format: false, i18n: duplicate, hint: "Must be today or earlier. / 不得晚于今天。"}
      - {label: Category / 分类, name: category, widget: string, i18n: true}
      - {label: Summary / 摘要, name: summary, widget: text, required: false, i18n: true}
      - {label: Featured image / 封面图片, name: image, widget: image, required: false, i18n: duplicate, hint: "One shared image for both languages. / 中英文共用一张图片。"}
      - {label: Image alt text / 图片说明, name: image_alt, widget: string, required: false, i18n: true}
      - {label: Body / 正文, name: body, widget: markdown, required: false, i18n: true}
  - name: events
    label: Carousel Events / 首页轮播
    label_singular: Carousel event / 轮播事件
    description: "Edit the English and Chinese slides in one entry. Save creates a draft only; click Publish and wait for deployment. / 在同一条目中维护中英文轮播；保存只是草稿，必须点击 Publish 并等待部署。"
    folder: content/cms/events
    create: true
    i18n: true
    filter: {field: cms_managed, value: true}
    path: '{{slug}}/index'
    fields:
      - {label: CMS managed / CMS 管理标记, name: cms_managed, widget: hidden, default: true, i18n: duplicate}
      - {label: Title / 标题, name: title, widget: string, i18n: true}
      - {label: Publication date / 发布日期, name: date, widget: datetime, time_format: false, i18n: duplicate, hint: "Must be today or earlier. / 不得晚于今天。"}
      - {label: Kicker / 栏目短标题, name: kicker, widget: string, i18n: true}
      - {label: Summary / 摘要, name: summary, widget: text, required: false, i18n: true}
      - {label: Hero image / 主图, name: hero, widget: image, i18n: duplicate}
      - {label: Image alt text / 图片说明, name: hero_alt, widget: string, i18n: true}
      - {label: Presentation style / 展示样式, name: hero_mode, widget: select, required: false, default: standard, options: [{label: Standard image / 标准图片, value: standard}, {label: Poster / 海报, value: poster}, {label: Split image and text / 图文分栏, value: split}, {label: AIR circuit animation / AIR 芯片动画, value: circuit}], i18n: duplicate, hint: "Use AIR circuit animation only for the permanent AIR opening slide. / AIR 芯片动画仅用于固定开场页。"}
      - {label: Image position / 图片位置, name: hero_position, widget: string, required: false, i18n: duplicate, hint: "Optional CSS position, such as top, center, or 50% 30%. / 可选，例如 top、center 或 50% 30%。"}
      - label: Event details / 事件详情
        name: details
        widget: list
        required: false
        i18n: true
        hint: "Speaker, time, venue, host, etc. / 可填写主讲、时间、地点、主持等信息。"
        fields:
          - {label: Label / 标签, name: label, widget: string}
          - {label: Value / 内容, name: value, widget: string}
      - {label: Button text / 按钮文字, name: button, widget: string, required: false, i18n: true, hint: "Leave empty when using Additional buttons. / 使用多按钮时留空。"}
      - {label: Button target / 按钮目标, name: target, widget: string, required: false, i18n: true, pattern: ['^(#|/|https?://)', 'Use #anchor, /path/, or a full http(s) URL / 请填写 #锚点、/站内路径/ 或完整 URL'], hint: "Example: #news or /news/article-slug/. / 例如 #news 或 /zh/news/article-slug/。"}
      - label: Additional buttons / 多按钮
        name: actions
        widget: list
        required: false
        i18n: true
        hint: "Add items only when more than one button is needed. / 仅在需要多个按钮时添加。"
        fields:
          - {label: Button text / 按钮文字, name: label, widget: string}
          - {label: Button target / 按钮目标, name: url, widget: string, pattern: ['^(#|/|https?://)', 'Use #anchor, /path/, or a full http(s) URL / 请填写 #锚点、/站内路径/ 或完整 URL']}
      - {label: Show in carousel / 进入轮播, name: featured, widget: boolean, default: true, i18n: duplicate, hint: "Turn off to hide without deleting. / 关闭后下架但不删除。"}
      - {label: Order / 顺序, name: weight, widget: number, default: 10, min: 1, value_type: int, i18n: duplicate, hint: "Lower numbers appear first; keep 1 for the AIR opening slide. / 数字越小越靠前；1 保留给 AIR 开场页。"}
      - {label: Body / 正文, name: body, widget: markdown, required: false, i18n: true}
  - name: publications
    label: Publications / 论文成果
    label_singular: Publication / 论文
    description: "Edit both language versions in one entry. Official paper title, authors, venue, year and DOI are shared; summaries and body text can be translated. / 在同一条目中维护中英文；正式题名、作者、期刊会议、年份与 DOI 共用。"
    folder: content/cms/publications
    create: true
    i18n: true
    filter: {field: cms_managed, value: true}
    path: '{{slug}}/index'
    fields:
      - {label: CMS managed, name: cms_managed, widget: hidden, default: true, i18n: duplicate}
      - {label: Show on homepage / 首页显示, name: list_on_homepage, widget: boolean, default: true, i18n: duplicate}
      - {label: Official paper title / 正式论文题名, name: title, widget: string, i18n: duplicate, hint: "Keep the DBLP title exactly the same to prevent duplicates. / 与 DBLP 题名完全一致可避免重复。"}
      - {label: Publication date / 发布日期, name: date, widget: datetime, time_format: false, i18n: duplicate, hint: "Must be today or earlier. / 不得晚于今天。"}
      - {label: Authors / 作者, name: authors, widget: string, i18n: duplicate}
      - {label: Venue / 期刊或会议, name: venue, widget: string, i18n: duplicate}
      - {label: Year / 年份, name: year, widget: number, value_type: int, i18n: duplicate}
      - {label: DOI, name: doi, widget: string, required: false, i18n: duplicate}
      - {label: PDF, name: pdf, widget: file, required: false, i18n: duplicate, hint: "Upload or select the paper PDF. / 上传或选择论文 PDF。"}
      - {label: Summary / 摘要, name: summary, widget: text, required: false, i18n: true}
      - {label: Body / 详细介绍, name: body, widget: markdown, required: false, i18n: true}
  - name: projects
    label: Projects / 科研项目
    label_singular: Project / 项目
    description: "Maintain the English and Chinese versions of each research project in one entry. / 在同一条目中维护科研项目的中英文版本。"
    folder: content/cms/projects
    create: true
    i18n: true
    filter: {field: cms_managed, value: true}
    path: '{{slug}}/index'
    fields:
      - {label: CMS managed, name: cms_managed, widget: hidden, default: true, i18n: duplicate}
      - {label: Project name / 项目名称, name: title, widget: string, i18n: true}
      - {label: Record date / 项目日期, name: date, widget: datetime, time_format: false, i18n: duplicate}
      - {label: Display order / 首页顺序, name: weight, widget: number, default: 10, min: 1, value_type: int, i18n: duplicate, hint: "Lower numbers appear first. / 数字越小越靠前。"}
      - {label: Status / 项目状态, name: status, widget: select, default: Active, options: [{label: Active / 进行中, value: Active}, {label: Completed / 已完成, value: Completed}, {label: Upcoming / 即将开始, value: Upcoming}], i18n: duplicate}
      - {label: Short summary / 项目简介, name: summary, widget: text, i18n: true, hint: "Short text displayed on the homepage card. / 首页项目卡片上的简短介绍。"}
      - {label: Project abstract / 项目摘要, name: abstract, widget: text, i18n: true}
  - name: awards
    label: Awards / 奖项
    label_singular: Award / 奖项
    description: "Edit the English and Chinese award records in one entry. / 在同一条目中维护奖项的中英文版本。"
    folder: content/cms/awards
    create: true
    i18n: true
    filter: {field: cms_managed, value: true}
    path: '{{slug}}/index'
    fields:
      - {label: CMS managed / CMS 管理标记, name: cms_managed, widget: hidden, default: true, i18n: duplicate}
      - {label: Title / 标题, name: title, widget: string, i18n: true}
      - {label: Date / 日期, name: date, widget: datetime, time_format: false, i18n: duplicate}
      - {label: Recipient / 获奖人或团队, name: recipient, widget: string, i18n: true, hint: "Person, team, or project receiving the award. / 填写获奖个人、团队或项目。"}
      - {label: Awarder / 颁奖方, name: awarder, widget: string, required: false, i18n: true, hint: "Optional awarding organization or program. / 可选，填写颁奖单位或项目。"}
      - {label: Level / 级别, name: level, widget: string, required: false, i18n: true, hint: "For example: Best Paper, National, Provincial, or University. / 例如：最佳论文、国家级、省级或校级。"}
      - {label: Summary / 摘要, name: summary, widget: text, required: false, i18n: true}
      - {label: Body / 正文, name: body, widget: markdown, required: false, i18n: true}
