backend:
  name: github
  repo: Zhonghai-Lu-Lab/zhonghai-lu-lab-website
  branch: main
  base_url: https://zhonghai-lu-lab-website.pages.dev
  auth_endpoint: /auth
  site_domain: zhonghai-lu-lab-website.pages.dev

publish_mode: editorial_workflow
media_folder: static/images/uploads
public_folder: /images/uploads

i18n:
  structure: multiple_folders
  locales: [en, zh]
  default_locale: en

collections:
  - name: news
    label: News / 新闻
    label_singular: News entry / 新闻
    description: "Edit the English and Chinese versions in the same entry. Save creates a draft only; click Publish and wait for GitHub and Cloudflare deployment. / 在同一条目中切换 English 与中文；保存只是草稿，必须点击 Publish。"
    folder: content/cms/news
    create: true
    i18n: true
    filter: {field: cms_managed, value: true}
    path: '{{slug}}/index'
    fields:
      - {label: CMS managed, name: cms_managed, widget: hidden, default: true, i18n: duplicate}
      - {label: Title / 标题, name: title, widget: string, i18n: true}
      - {label: Publication date / 发布日期, name: date, widget: datetime, time_format: false, i18n: duplicate, hint: "Must be today or earlier. / 不得晚于今天。"}
      - {label: Category / 分类, name: category, widget: string, i18n: true}
      - {label: Summary / 摘要, name: summary, widget: text, required: false, i18n: true}
      - {label: Featured image / 封面图片, name: image, widget: image, required: false, i18n: duplicate, hint: "One shared image for both languages. / 中英文共用一张图片。"}
      - {label: Image alt text / 图片说明, name: image_alt, widget: string, required: false, i18n: true}
      - {label: Body / 正文, name: body, widget: markdown, required: false, i18n: true}
  - name: events_en
    label: Carousel Events (English)
    description: "Save creates a draft only. Click Publish and wait for the GitHub merge and Cloudflare deployment. Show in carousel controls visibility; lower Order values appear earlier. Order 1 is reserved for the AIR circuit animation."
    folder: content/en/events
    create: true
    filter: {field: cms_managed, value: true}
    path: '{{slug}}/index'
    fields:
      - {label: CMS managed, name: cms_managed, widget: hidden, default: true}
      - {label: Title, name: title, widget: string}
      - {label: Publication date, name: date, widget: datetime, time_format: false, hint: "Must be today or earlier. Hugo does not publish future-dated slides."}
      - {label: Kicker, name: kicker, widget: string}
      - {label: Summary, name: summary, widget: text, required: false}
      - {label: Hero image, name: hero, widget: image}
      - {label: Image alt text, name: hero_alt, widget: string}
      - {label: Presentation style, name: hero_mode, widget: select, required: false, default: standard, options: [{label: Standard image, value: standard}, {label: Poster, value: poster}, {label: Split image and text, value: split}, {label: AIR circuit animation, value: circuit}], hint: "Use AIR circuit animation only for the permanent AIR Lab opening slide."}
      - {label: Image position, name: hero_position, widget: string, required: false, hint: "Optional CSS position such as top, center, or 50% 30%."}
      - label: Event details
        name: details
        widget: list
        required: false
        hint: "Optional structured details such as speaker, time, venue, and host."
        fields:
          - {label: Label, name: label, widget: string}
          - {label: Value, name: value, widget: string}
      - {label: Button text, name: button, widget: string, required: false, hint: "Use for a single button; leave empty when using Additional buttons"}
      - {label: Button target, name: target, widget: string, required: false, pattern: ['^(#|/|https?://)', 'Use #anchor, /path/, or a full http(s) URL'], hint: "Use a section anchor such as #news or a verified page path such as /publications/paper-slug/"}
      - label: Additional buttons
        name: actions
        widget: list
        required: false
        hint: "Use this list when the slide needs more than one button"
        fields:
          - {label: Button text, name: label, widget: string}
          - {label: Button target, name: url, widget: string, pattern: ['^(#|/|https?://)', 'Use #anchor, /path/, or a full http(s) URL']}
      - {label: Show in carousel, name: featured, widget: boolean, default: true, hint: "Turn off to remove this item from the homepage carousel without deleting it."}
      - {label: Order, name: weight, widget: number, default: 10, min: 1, value_type: int, hint: "Lower numbers appear earlier. Keep 1 for the permanent AIR Lab opening slide; use 2 or greater for new slides."}
      - {label: Body, name: body, widget: markdown, required: false}
  - name: events_zh
    label: 轮播事件（中文）
    description: "保存只会创建草稿。必须点击 Publish，并等待 GitHub 合并及 Cloudflare 部署完成。进入轮播控制上下架；顺序数字越小越靠前，1 保留给 AIR 芯片动画。"
    folder: content/zh/events
    create: true
    filter: {field: cms_managed, value: true}
    path: '{{slug}}/index'
    fields:
      - {label: CMS 管理标记, name: cms_managed, widget: hidden, default: true}
      - {label: 标题, name: title, widget: string}
      - {label: 发布日期, name: date, widget: datetime, time_format: false, hint: "不得晚于今天；Hugo 不会生成未来日期的轮播内容。"}
      - {label: 栏目短标题, name: kicker, widget: string}
      - {label: 摘要, name: summary, widget: text, required: false}
      - {label: 主图, name: hero, widget: image}
      - {label: 图片替代文本, name: hero_alt, widget: string}
      - {label: 展示样式, name: hero_mode, widget: select, required: false, default: standard, options: [{label: 标准图片, value: standard}, {label: 海报, value: poster}, {label: 图文分栏, value: split}, {label: AIR 芯片动画, value: circuit}], hint: "AIR 芯片动画仅用于固定的 AIR 实验室开场页。"}
      - {label: 图片位置, name: hero_position, widget: string, required: false, hint: "可选，例如 top、center 或 50% 30%。"}
      - label: 事件详情
        name: details
        widget: list
        required: false
        hint: "可选，可填写主讲、时间、地点、主持等结构化信息。"
        fields:
          - {label: 标签, name: label, widget: string}
          - {label: 内容, name: value, widget: string}
      - {label: 按钮文字, name: button, widget: string, required: false, hint: "单按钮时填写；使用多个按钮时留空"}
      - {label: 按钮目标, name: target, widget: string, required: false, pattern: ['^(#|/|https?://)', '请填写 #锚点、/站内路径/ 或完整 http(s) URL'], hint: "填写栏目锚点（如 #news）或已核实的详情页路径（如 /zh/publications/paper-slug/）"}
      - label: 多按钮
        name: actions
        widget: list
        required: false
        hint: "轮播需要多个按钮时在此添加"
        fields:
          - {label: 按钮文字, name: label, widget: string}
          - {label: 按钮目标, name: url, widget: string, pattern: ['^(#|/|https?://)', '请填写 #锚点、/站内路径/ 或完整 http(s) URL']}
      - {label: 进入轮播, name: featured, widget: boolean, default: true, hint: "关闭后会从首页轮播下架，但不会删除内容。"}
      - {label: 顺序, name: weight, widget: number, default: 10, min: 1, value_type: int, hint: "数字越小越靠前。1 保留给固定 AIR 实验室开场页，新轮播请使用 2 或更大的数字。"}
      - {label: 正文, name: body, widget: markdown, required: false}
  - name: publications
    label: Publications / 论文成果
    label_singular: Publication / 论文
    description: "Edit both language versions in one entry. Official paper title, authors, venue, year and DOI are shared; summaries and body text can be translated. / 在同一条目中维护中英文；正式题名、作者、期刊会议、年份与 DOI 共用。"
    folder: content/cms/publications
    create: true
    i18n: true
    filter: {field: cms_managed, value: true}
    path: '{{slug}}/index'
    fields:
      - {label: CMS managed, name: cms_managed, widget: hidden, default: true, i18n: duplicate}
      - {label: Show on homepage / 首页显示, name: list_on_homepage, widget: boolean, default: true, i18n: duplicate}
      - {label: Official paper title / 正式论文题名, name: title, widget: string, i18n: duplicate, hint: "Keep the DBLP title exactly the same to prevent duplicates. / 与 DBLP 题名完全一致可避免重复。"}
      - {label: Publication date / 发布日期, name: date, widget: datetime, time_format: false, i18n: duplicate, hint: "Must be today or earlier. / 不得晚于今天。"}
      - {label: Authors / 作者, name: authors, widget: string, i18n: duplicate}
      - {label: Venue / 期刊或会议, name: venue, widget: string, i18n: duplicate}
      - {label: Year / 年份, name: year, widget: number, value_type: int, i18n: duplicate}
      - {label: DOI, name: doi, widget: string, required: false, i18n: duplicate}
      - {label: PDF, name: pdf, widget: file, required: false, i18n: duplicate, hint: "Upload or select the paper PDF. / 上传或选择论文 PDF。"}
      - {label: Summary / 摘要, name: summary, widget: text, required: false, i18n: true}
      - {label: Body / 详细介绍, name: body, widget: markdown, required: false, i18n: true}
  - name: projects
    label: Projects / 科研项目
    label_singular: Project / 项目
    description: "Project-specific bilingual fields based on the current NSFC project: funding organization, grant number, project duration and related event. / 按现有国家自然科学基金项目设置专属字段。"
    folder: content/cms/projects
    create: true
    i18n: true
    filter: {field: cms_managed, value: true}
    path: '{{slug}}/index'
    fields:
      - {label: CMS managed, name: cms_managed, widget: hidden, default: true, i18n: duplicate}
      - {label: Project name / 项目名称, name: title, widget: string, i18n: true}
      - {label: Record date / 项目日期, name: date, widget: datetime, time_format: false, i18n: duplicate}
      - {label: Display order / 首页顺序, name: weight, widget: number, default: 10, min: 1, value_type: int, i18n: duplicate, hint: "Lower numbers appear first. / 数字越小越靠前。"}
      - {label: Status / 项目状态, name: status, widget: select, default: Active, options: [{label: Active / 进行中, value: Active}, {label: Completed / 已完成, value: Completed}, {label: Upcoming / 即将开始, value: Upcoming}], i18n: duplicate}
      - {label: Short summary / 项目简介, name: summary, widget: text, i18n: true, hint: "Short text displayed on the homepage card. / 首页项目卡片上的简短介绍。"}
      - {label: Project abstract / 项目摘要, name: abstract, widget: text, i18n: true}
      - {label: Funding organization / 资助机构, name: funded_by, widget: string, required: false, i18n: true, hint: "Example: National Natural Science Foundation of China (NSFC) / 国家自然科学基金"}
      - {label: Grant number / 项目批准号, name: grant_no, widget: string, required: false, i18n: duplicate}
      - {label: Project duration / 项目周期, name: duration, widget: string, required: false, i18n: true, hint: "Example: 2026-01-01 — 2028-12-31 / 2026 年 1 月—2028 年 12 月"}
      - {label: Related event / 相关活动, name: event, widget: string, required: false, i18n: true}
  - name: awards_en
    label: Awards (English)
    folder: content/en/awards
    create: true
    path: '{{slug}}/index'
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Date, name: date, widget: datetime, time_format: false}
      - {label: Recipient, name: recipient, widget: string, hint: "Person, team, or project receiving the award"}
      - {label: Awarder, name: awarder, widget: string, required: false, hint: "Optional organization or program granting the award"}
      - {label: Level, name: level, widget: string, required: false, hint: "Optional, e.g. Best Paper / National / Provincial / University"}
      - {label: Summary, name: summary, widget: text, required: false}
      - {label: Body, name: body, widget: markdown, required: false}
  - name: awards_zh
    label: 奖项（中文）
    folder: content/zh/awards
    create: true
    path: '{{slug}}/index'
    fields:
      - {label: 标题, name: title, widget: string}
      - {label: 日期, name: date, widget: datetime, time_format: false}
      - {label: 获奖人或团队, name: recipient, widget: string, hint: "填写获奖个人、团队或项目"}
      - {label: 颁奖方, name: awarder, widget: string, required: false, hint: "可选，填写颁奖单位或项目名称"}
      - {label: 级别, name: level, widget: string, required: false, hint: "可选，例如 最佳论文 / 国家级 / 省级 / 校级"}
      - {label: 摘要, name: summary, widget: text, required: false}
      - {label: 正文, name: body, widget: markdown, required: false}
